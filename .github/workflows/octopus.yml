name: Octopus Deploy

env:
  # TODO: Should use project version
  PACKAGE_PREFIX: 2021.1.1
  OCTOPUS_PROJECT_NAME: io
  OCTOPUS_SPACE_NAME: Default
  OCTOPUS_ENVIRONMENT_NAME: Production

on:
  push:
    branches: master

#   schedule:
#     - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Yarn install
        uses: Borales/actions-yarn@v2.3.0
        with:
          cmd: install

#      - name:Yarn audit
#        uses: borales/actions-yarn@v2.0.0
#        with:
#          cmd: audit

      - name: Yarn build
        uses: Borales/actions-yarn@v2.3.0
        with:
          cmd: build

      # https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-commands-for-github-actions#environment-files
      - name: Set version
        id: set-version
        run: echo "PACKAGE_VERSION=${PACKAGE_PREFIX}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v2
        with:
          name: dist
          path: dist/

      - name: Install Octopus CLI 🐙
        uses: OctopusDeploy/install-octopus-cli-action@v1.1.6
        with:
          version: latest

      - name: list-octopusdeploy-deployments
        run: >
          octo list-deployments --server=${{ secrets.OCTOPUS_SERVER }}
          --apiKey=${{ secrets.OCTOPUS_APIKEY }}

      # https://octopus.com/docs/octopus-rest-api/octopus-cli/push
      - name: Package and Push to Octopus
        run: |
          echo "Packing..." && \
          octo pack --id="dist" --format="Zip" --version="$PACKAGE_VERSION" \
          --basePath="./dist/" --outFolder="./packages" && \
          echo "Pushing..." && \
          octo push --package="./packages/dist.${PACKAGE_VERSION}.zip" \
          --server="${{ secrets.OCTOPUS_SERVER }}" --apiKey="${{ secrets.OCTOPUS_APIKEY }}" \
          --overwrite-mode="OverwriteExisting"

      - name: Create and Deploy Release
        run: |
          octo create-release --project="$OCTOPUS_PROJECT_NAME" \
          --packageVersion="$PACKAGE_VERSION" --releaseNumber="${PACKAGE_VERSION}" \
          --server="${{ secrets.OCTOPUS_SERVER }}" --apiKey="${{ secrets.OCTOPUS_APIKEY }}" \
          --space="$OCTOPUS_SPACE_NAME" --deployTo="$OCTOPUS_ENVIRONMENT_NAME"
